name: mtg-websocket-relay

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mtg:
    <<: *service-defaults
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mtg-websocket-relay:${MTG_IMAGE_TAG:-local}
    network_mode: host
    user: "${MTG_UID:-1000}:${MTG_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 20s
    volumes:
      - ./state/mtg.toml:/config/config.toml:ro

  nginx:
    <<: *service-defaults
    platform: linux/amd64
    image: nginx:1.28-alpine
    network_mode: host
    read_only: true
    pids_limit: 256
    stop_grace_period: 20s
    depends_on:
      mtg:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      RELAY_PATH: ${RELAY_PATH:?Set RELAY_PATH in .env}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_HEALTH_PORT: ${NGINX_HEALTH_PORT:-8080}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|RELAY_PATH|HTTP_PORT|HTTPS_PORT|NGINX_HEALTH_PORT)$$
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - ./nginx/relay.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./site:/srv/decoy:ro
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH in .env}:/run/tls/fullchain.pem:ro
      - ${TLS_CERTIFICATE_KEY_PATH:?Set TLS_CERTIFICATE_KEY_PATH in .env}:/run/tls/privkey.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${NGINX_HEALTH_PORT}/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s