# Nginx reference for the authenticated mtg WebSocket relay.
#
# Include this file from the nginx `http` context after replacing every
# double-underscore placeholder below. Keep the relay path identical to [websocket-relay].path in
# mtg, but never put the bearer credential in this file or in any URL.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mtg_websocket_relay {
    # Must match the loopback-only [websocket-relay].bind-to value in mtg.
    server __MTG_WEBSOCKET_RELAY_ADDRESS__;
    keepalive 8;
}

upstream relay_decoy_site {
    # Replace with the same ordinary site upstream used by `location /`.
    server __DECOY_UPSTREAM_ADDRESS__;
    keepalive 8;
}

# Log the normalized path without the query string and no request headers.
# In particular, never add $args, $request, $http_authorization, or referrer
# fields to this or any other access/error log format.
log_format relay_site '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name __RELAY_SERVER_NAME__;

    ssl_certificate     __TLS_CERTIFICATE_PATH__;
    ssl_certificate_key __TLS_CERTIFICATE_KEY_PATH__;

    # Keep the site's existing TLS policy, HSTS, and certificate-renewal
    # integration here. TLS termination intentionally remains outside mtg.

    access_log __ACCESS_LOG_PATH__ relay_site;
    error_log  __ERROR_LOG_PATH__ warn;

    location = __RELAY_PATH__ {
        proxy_pass http://mtg_websocket_relay;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Overwrite client-supplied forwarding headers. mtg trusts X-Real-IP
        # only because this proxy connects from loopback.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;

        # Both values exceed mtg's default 5 minute active-relay idle timeout.
        # Increase them if [network.timeout].idle is configured above 5m.
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;

        # mtg deliberately returns one generic pre-upgrade rejection. Convert
        # it, other plausible pre-upgrade statuses, and backend failures into
        # the ordinary site's response.
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 408 409 413 414 421 425 426 429 431
                   500 501 502 503 504 = @relay_decoy;
    }

    location @relay_decoy {
        # Do not intercept the decoy's own response: that would risk a loop.
        proxy_intercept_errors off;

        # Always make a bodyless GET for the ordinary site's root rather than
        # disclosing the path, method, or body used to probe the relay.
        rewrite ^ / break;
        proxy_pass http://relay_decoy_site;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_body off;

        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Sec-WebSocket-Protocol "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        # Replace or merge this block with the site's genuine configuration.
        # No non-exact path is sent to mtg. Strip relay-sensitive headers so a
        # mistyped relay path cannot disclose them to the ordinary site.
        proxy_pass http://relay_decoy_site;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Sec-WebSocket-Protocol "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }
}